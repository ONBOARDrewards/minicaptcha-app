<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>minicaptcha — embed example</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #0a0b0d;
        --lime: #c9f75d;
        --line: #e0e0d8;
        --font: 'Lexend', ui-sans-serif, system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f5f1;
        background-image: radial-gradient(rgba(10, 11, 13, 0.06) 1px, transparent 1px);
        background-size: 22px 22px;
        font-family: var(--font);
        color: var(--ink);
        padding: 32px 20px;
      }
      .card {
        width: min(460px, 100%);
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 22px;
        padding: 34px;
        box-shadow: 0 34px 60px -46px rgba(10, 11, 13, 0.6);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: rgba(10, 11, 13, 0.45);
        margin-bottom: 18px;
      }
      .brand b {
        color: var(--ink);
      }
      h1 {
        font-size: 28px;
        letter-spacing: -0.04em;
        font-weight: 500;
        margin: 0 0 6px;
      }
      p.sub {
        margin: 0 0 26px;
        font-size: 14px;
        color: rgba(10, 11, 13, 0.6);
        font-weight: 300;
        line-height: 1.6;
      }
      label {
        display: block;
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: rgba(10, 11, 13, 0.45);
        margin-bottom: 7px;
      }
      input[type='email'] {
        width: 100%;
        padding: 13px 15px;
        border-radius: 12px;
        border: 1px solid var(--line);
        font: inherit;
        font-size: 14px;
        background: #fbfbf6;
        margin-bottom: 18px;
      }
      input[type='email']:focus {
        outline: 2px solid var(--ink);
        outline-offset: 1px;
      }
      button.submit {
        width: 100%;
        margin-top: 18px;
        padding: 14px;
        border: 0;
        border-radius: 999px;
        background: var(--ink);
        color: #fff;
        font: inherit;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
      }
      button.submit:hover {
        background: #1c1e22;
      }
      .status {
        margin-top: 18px;
        font-size: 11.5px;
        color: rgba(10, 11, 13, 0.5);
        word-break: break-all;
        min-height: 16px;
        font-family: ui-monospace, Menlo, monospace;
      }
      .note {
        margin-top: 26px;
        padding-top: 18px;
        border-top: 1px solid #eaeae3;
        font-size: 11.5px;
        color: rgba(10, 11, 13, 0.4);
        line-height: 1.6;
      }
      .note code {
        font-family: ui-monospace, Menlo, monospace;
        background: #f3f3ec;
        padding: 1px 5px;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand"><b>loopcast</b> · example signup</div>
      <h1>Create your account</h1>
      <p class="sub">A third-party page with no build step — just the script tag and an empty div.</p>

      <form id="signup">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@example.com" required />

        <!-- the whole integration: one empty div per form -->
        <div data-minicaptcha data-sitekey="demo" data-puzzle="sort"></div>

        <button class="submit" type="submit">Create account</button>
      </form>

      <p class="status" id="status">waiting for a token…</p>

      <p class="note">
        The script adds a hidden <code>minicaptcha-token</code> input to the form and fires
        <code>minicaptcha:verified</code>. This form pins <code>data-puzzle="sort"</code> for a predictable demo.
      </p>
    </main>

    <script src="/embed.js" defer></script>
    <script>
      document.addEventListener('minicaptcha:verified', function (event) {
        document.getElementById('status').textContent = 'token → ' + event.detail.token
      })
      document.getElementById('signup').addEventListener('submit', function (event) {
        event.preventDefault()
        var token = document.querySelector('input[name="minicaptcha-token"]')
        document.getElementById('status').textContent = token
          ? 'submitting with token → ' + token.value
          : 'blocked in real life: no token yet'
      })
    </script>
  </body>
</html>
